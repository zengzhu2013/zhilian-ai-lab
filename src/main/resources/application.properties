# 应用名称
spring.application.name=ai
# 服务端口
server.port=8080

# 模型配置 - 阿里百炼大模型平台 https://bailian.console.aliyun.com/cn-beijing?tab=model#/model-usage
spring.ai.dashscope.enabled=true
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY}

spring.ai.dashscope.chat.options.model=qwen3.6-plus
spring.ai.dashscope.chat.options.multi-model=true

# rerank 配置
spring.ai.dashscope.rerank.options.model=qwen3-vl-rerank
#spring.ai.dashscope.rerank.base-url=https://dashscope.aliyuncs.com

# 向量配置
spring.ai.dashscope.embedding.options.model=text-embedding-v1
spring.ai.dashscope.embedding.options.text-type=document
spring.ai.dashscope.embedding.options.dimensions=1536
#spring.ai.dashscope.embedding.base-url=https://dashscope.aliyuncs.com


# milvus 配置
spring.ai.vectorstore.milvus.client.host=192.168.0.143
spring.ai.vectorstore.milvus.client.port=19530
#spring.ai.vectorstore.milvus.client.username=root
#spring.ai.vectorstore.milvus.client.password=milvus
spring.ai.vectorstore.milvus.databaseName=default
spring.ai.vectorstore.milvus.collectionName=ragtest
spring.ai.vectorstore.milvus.initializeSchema=true
spring.ai.vectorstore.milvus.embeddingDimension=1536

# 日志配置
logging.level.org.springframework.ai=debug
logging.level.com.alibaba.cloud.ai=debug

# 字符编码配置
server.servlet.encoding.charset=UTF-8
server.tomcat.uriEncoding=UTF-8
server.tomcat.connectionTimeout=20000



spring.datasource.url=jdbc:mysql://192.168.0.142:33306/test_ai?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=mysql
spring.datasource.password=123456


